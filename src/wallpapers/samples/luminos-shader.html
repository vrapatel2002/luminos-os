<!DOCTYPE html>
<!--
    Luminos sample wallpaper — self-contained WebGL fragment shader (animated gradient).
    Shadertoy-style: full-screen quad, iTime/iResolution/iMouse uniforms. No assets.
    [CHANGE: claude-code | 2026-07-22]
    SPDX-License-Identifier: GPL-3.0-or-later
-->
<meta charset="utf-8">
<title>Luminos Shader</title>
<style>html,body{margin:0;height:100%;background:#000;overflow:hidden}canvas{display:block}</style>
<canvas id="c"></canvas>
<script>
(function(){
  var cv=document.getElementById("c");
  var gl=cv.getContext("webgl");
  if(!gl){document.body.innerHTML="<p style='color:#888;font:14px sans-serif;padding:2em'>WebGL unavailable.</p>";return;}

  var vs="attribute vec2 p;void main(){gl_Position=vec4(p,0.,1.);}";
  var fs=[
    "precision highp float;",
    "uniform vec2 iResolution;uniform float iTime;uniform vec2 iMouse;",
    "void main(){",
    "  vec2 uv=(gl_FragCoord.xy-0.5*iResolution)/iResolution.y;",
    "  vec2 m=(iMouse-0.5*iResolution)/iResolution.y;",
    "  float t=iTime*0.25;",
    "  float d=length(uv-m*0.6);",
    "  float w=sin(d*8.0-iTime*1.5)*0.5+0.5;",
    "  vec3 a=vec3(0.05,0.10,0.25), b=vec3(0.15,0.55,0.85), c=vec3(0.85,0.35,0.65);",
    "  vec3 col=mix(a,b,0.5+0.5*sin(uv.x*2.0+t));",
    "  col=mix(col,c,w*0.6);",
    "  col+=0.15*sin(uv.y*3.0-t*2.0);",
    "  gl_FragColor=vec4(col,1.0);",
    "}"
  ].join("\n");

  function sh(type,src){var s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);return s;}
  var pr=gl.createProgram();
  gl.attachShader(pr,sh(gl.VERTEX_SHADER,vs));
  gl.attachShader(pr,sh(gl.FRAGMENT_SHADER,fs));
  gl.linkProgram(pr); gl.useProgram(pr);

  var buf=gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER,buf);
  gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
  var loc=gl.getAttribLocation(pr,"p");
  gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);

  var uRes=gl.getUniformLocation(pr,"iResolution"),
      uTime=gl.getUniformLocation(pr,"iTime"),
      uMouse=gl.getUniformLocation(pr,"iMouse");

  var DPR=Math.min(window.devicePixelRatio||1,1.5), mx=0,my=0;
  function size(){cv.width=innerWidth*DPR;cv.height=innerHeight*DPR;gl.viewport(0,0,cv.width,cv.height);}
  size(); addEventListener("resize",size);
  function move(e){mx=e.clientX*DPR;my=cv.height-e.clientY*DPR;}
  addEventListener("mousemove",move); document.addEventListener("mousemove",move);

  var t0=performance.now();
  (function loop(){
    requestAnimationFrame(loop);
    gl.uniform2f(uRes,cv.width,cv.height);
    gl.uniform1f(uTime,(performance.now()-t0)/1000);
    gl.uniform2f(uMouse,mx,my);
    gl.drawArrays(gl.TRIANGLES,0,3);
  })();
})();
</script>
