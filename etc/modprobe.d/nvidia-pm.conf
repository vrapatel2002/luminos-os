# [CHANGE: claude-code | 2026-05-14] BUG-050 ROOT-01
# Fine-grained dynamic power management — GPU enters D3cold when idle
options nvidia NVreg_DynamicPowerManagement=0x02
# NOTE: NVreg_EnableS0ixPowerManagement intentionally NOT set.
# S0ix PM is for Intel+NVIDIA platforms. On AMD (G14 GA403UU) it breaks DPM.
# DPM=0x02 alone is the correct config for AMD+NVIDIA Optimus.
