# [CHANGE: claude-code | 2026-07-30]
# Without a country the kernel falls back to regulatory domain 00, which forbids
# the 6 GHz band outright and caps 5 GHz transmit power. The MT7922 has a working
# 6 GHz radio (59 channels). Requires wireless-regdb to be installed.
options cfg80211 ieee80211_regdom=CA
