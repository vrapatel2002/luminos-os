<title>Sub-page Layouts</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:opsz,wght@6..144,400..600&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,400..600&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,400..500,0..1,0..200&display=block">
<style>
/* Layout: one System Settings window, five ways to handle categories that have sub-pages, switchable from the strip.
   Single dark look on purpose (Caelestia dark scheme). Timing toggle compares the current 500 ms bouncy motion with a snappy 180 ms one. */
:root {
  color-scheme: dark;
  --desk: #0b0b0e; --surface: #131317; --sc-lowest: #0e0e12; --sc-low: #1c1b1f; --sc: #201f23; --sc-high: #2a292e; --sc-highest: #353438;
  --sec: #45455c; --on-sec: #b4b2ce; --primary: #c2c1ff; --on-primary: #2a2a60; --on-surface: #e5e1e7; --on-var: #c8c5d1; --outline: #918f9a; --outline-var: #47464f;
  --ease: cubic-bezier(.2, 0, 0, 1);              /* M3 standard: no overshoot */
  --ease-bounce: cubic-bezier(.38, 1.21, .22, 1);  /* what the build uses now */
  --dur: 180ms; --dur-fx: 120ms; --cur-ease: var(--ease);
  --font: "Google Sans Flex", "Google Sans", "Roboto Flex", system-ui, sans-serif;
}
html, body { height: 100%; }
body { background: var(--desk); color: var(--on-surface); font: 14px/1.35 var(--font); padding-inline: 16px; padding-block: 20px 40px; box-sizing: border-box; }
* { box-sizing: border-box; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
.ms { font-family: "Material Symbols Rounded"; font-size: 22px; line-height: 1; font-variation-settings: "FILL" 0, "wght" 500, "opsz" 24; display: inline-block; width: 1em; height: 1em; overflow: hidden; flex: none; font-feature-settings: "liga"; user-select: none; white-space: nowrap; }

/* strip */
.strip { max-width: 1080px; margin: 0 auto 12px; display: flex; flex-direction: column; gap: 10px; }
.strip h1 { margin: 0; font-size: 18px; font-weight: 500; }
.strip p { margin: 0; color: var(--on-var); font-size: 13px; max-width: 80ch; }
.modes { display: flex; flex-wrap: wrap; gap: 2px; }
.modes button, .speed button { border: 0; cursor: pointer; background: var(--sc-high); color: var(--on-var); padding: 9px 14px; font-size: 13px; white-space: nowrap; display: inline-flex; gap: 6px; align-items: center;
  border-radius: 4px; transition: background-color var(--dur-fx) var(--ease), border-radius var(--dur) var(--cur-ease); }
.modes button:first-child, .speed button:first-child { border-radius: 999px 4px 4px 999px; }
.modes button:last-child, .speed button:last-child { border-radius: 4px 999px 999px 4px; }
.modes button[aria-pressed="true"], .speed button[aria-pressed="true"] { background: var(--sec); color: var(--on-sec); border-radius: 999px; }
.modes button .ms, .speed button .ms { font-size: 17px; }
.row2 { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; justify-content: space-between; }
.speed { display: flex; gap: 2px; align-items: center; }
.speed span.l { font-size: 12.5px; color: var(--outline); margin-right: 8px; }
.note { max-width: 1080px; margin: 0 auto 12px; background: var(--sc-low); border-radius: 16px; padding: 12px 16px; display: flex; gap: 12px; align-items: flex-start; font-size: 13.5px; color: var(--on-var); line-height: 1.5; }
.note .ms { color: var(--primary); margin-top: 1px; }
.note b { color: var(--on-surface); font-weight: 500; }

/* window */
.stage { overflow-x: auto; padding-block: 2px 14px; }
.win { --nav-w: 320px; position: relative; width: 1080px; height: 700px; margin: 0 auto; background: var(--sc-low); border-radius: 16px; overflow: hidden;
  box-shadow: 0 24px 48px rgba(0,0,0,.45), inset 0 0 0 1px rgba(255,255,255,.05); }
.deco { position: absolute; top: 0; right: 0; height: 40px; display: flex; align-items: center; padding-right: 8px; z-index: 5; }
.deco span { width: 36px; display: grid; place-items: center; color: var(--on-surface); }
.deco .ms { font-size: 18px; }
.hole { position: absolute; top: 40px; right: 12px; bottom: 12px; left: calc(var(--nav-w) + 28px); background: var(--surface); border-radius: 16px; transition: left var(--dur) var(--cur-ease); }
.nav { position: absolute; top: 40px; bottom: 12px; left: 14px; width: var(--nav-w); display: flex; flex-direction: column; gap: 10px; transition: width var(--dur) var(--cur-ease); }
.page { position: absolute; top: 40px; right: 12px; bottom: 12px; left: calc(var(--nav-w) + 28px); padding: 22px 28px 16px; display: flex; flex-direction: column; gap: 16px; transition: left var(--dur) var(--cur-ease); min-width: 0; }
.win.rail { --nav-w: 64px; }
.win.drawer-mode.sub { --nav-w: 300px; }

/* sidebar bits */
.search { height: 48px; border-radius: 999px; background: var(--sc-lowest); border: 1px solid var(--outline-var); display: flex; align-items: center; gap: 10px; padding: 0 16px; color: var(--on-var); flex: none; }
.search input { all: unset; flex: 1; min-width: 0; color: var(--on-surface); font-size: 15px; }
.search input::placeholder { color: var(--on-var); }
.list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 4px; scrollbar-width: none; padding-bottom: 8px; position: relative; }
.list::-webkit-scrollbar { display: none; }
.cat { flex: none; font-size: 12px; font-weight: 500; letter-spacing: .04em; color: var(--outline); padding: 10px 16px 2px; }
.item { position: relative; flex: none; display: flex; align-items: center; gap: 12px; padding: 12px 14px; min-height: 64px; background: var(--sc-high); cursor: pointer; user-select: none;
  border-radius: var(--tl, 4px) var(--tl, 4px) var(--bl, 4px) var(--bl, 4px);
  transition: border-radius var(--dur) var(--cur-ease), background-color var(--dur-fx) var(--ease); overflow: hidden; }
.item:hover::after { content: ""; position: absolute; inset: 0; background: var(--on-surface); opacity: .08; pointer-events: none; }
.item:active { --tl: 12px !important; --bl: 12px !important; }
.item.cur { background: var(--sec); }
.disc { flex: none; width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; background: var(--sec); color: var(--on-sec); transition: background-color var(--dur-fx) var(--ease); }
.item.cur .disc { background: var(--primary); color: var(--on-primary); }
.txt { min-width: 0; flex: 1; display: flex; flex-direction: column; }
.lb { font-size: 15.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ds { font-size: 12.5px; color: var(--on-var); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chev { color: var(--on-var); font-size: 20px; transition: transform var(--dur) var(--cur-ease); }
.item.child { min-height: 50px; padding: 8px 14px 8px 66px; background: var(--sc); }
.item.child.cur { background: var(--sec); }
.item.child .lb { font-size: 14.5px; }
.backbar { display: flex; align-items: center; gap: 10px; height: 48px; flex: none; }
.iconbtn { width: 40px; height: 40px; border: 0; border-radius: 50%; background: var(--sc-high); color: var(--on-var); display: grid; place-items: center; cursor: pointer; flex: none; transition: background-color var(--dur-fx) var(--ease); }
.iconbtn:hover { background: color-mix(in srgb, var(--on-surface) 10%, var(--sc-high)); }
.backbar .t { font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; }
.chipbtn { border: 0; cursor: pointer; background: var(--sc-high); color: var(--on-var); border-radius: 999px; height: 36px; padding: 0 12px; display: inline-flex; align-items: center; gap: 6px; font-size: 13px; white-space: nowrap; }
.slide { animation: slidein var(--dur) var(--cur-ease); }
.slide.back { animation-name: slideback; }
@keyframes slidein { from { transform: translateX(28px); opacity: 0; } }
@keyframes slideback { from { transform: translateX(-28px); opacity: 0; } }

/* rail + flyout */
.win.rail .item { justify-content: center; padding: 12px 0; min-height: 56px; }
.win.rail .item .txt, .win.rail .item .chev, .win.rail .cat, .win.rail .search { display: none; }
.flyout { position: absolute; z-index: 20; left: 84px; width: 280px; background: var(--sc-high); border-radius: 20px; padding: 8px; display: flex; flex-direction: column; gap: 2px;
  box-shadow: 0 12px 32px rgba(0,0,0,.5); animation: pop var(--dur) var(--cur-ease); transform-origin: left center; }
.flyout h4 { margin: 6px 10px 6px; font-size: 15px; font-weight: 500; }
.flyout button { border: 0; background: transparent; text-align: left; padding: 10px 12px; border-radius: 12px; cursor: pointer; display: flex; flex-direction: column; gap: 1px; }
.flyout button:hover { background: color-mix(in srgb, var(--on-surface) 8%, transparent); }
.flyout button.cur { background: var(--sec); color: var(--on-sec); }
.flyout button span { font-size: 12.5px; color: var(--on-var); }
@keyframes pop { from { opacity: 0; transform: scale(.94) translateX(-6px); } }

/* edge drawers (Caelestia-style: grow out of the window frame, one at a time) */
.hot { position: absolute; z-index: 15; }
.hot.left { left: 0; top: 52px; bottom: 52px; width: 14px; }
.hot.top { top: 0; left: 120px; right: 140px; height: 12px; }
.hot.right { right: 0; top: 52px; bottom: 52px; width: 12px; }
.hot::after { content: ""; position: absolute; background: var(--outline); opacity: .35; border-radius: 99px; transition: opacity var(--dur-fx) var(--ease); }
.hot.left::after { left: 4px; top: 50%; width: 4px; height: 56px; transform: translateY(-50%); }
.hot.top::after { top: 4px; left: 50%; height: 4px; width: 56px; transform: translateX(-50%); }
.hot.right::after { right: 4px; top: 50%; width: 4px; height: 56px; transform: translateY(-50%); }
.hot:hover::after { opacity: .9; }
.drawer { position: absolute; z-index: 18; background: var(--sc-low); box-shadow: 0 0 0 1px rgba(255,255,255,.05), 0 18px 40px rgba(0,0,0,.55); display: flex; flex-direction: column; gap: 8px; padding: 14px;
  transition: transform var(--dur) var(--cur-ease), opacity var(--dur-fx) var(--ease); opacity: 0; pointer-events: none; }
.drawer.open { opacity: 1; pointer-events: auto; transform: none !important; }
.drawer.left { left: 0; top: 40px; bottom: 12px; width: 340px; border-radius: 0 24px 24px 0; transform: translateX(-104%); }
.drawer.top { top: 0; left: 50%; width: 520px; margin-left: -260px; border-radius: 0 0 24px 24px; transform: translateY(-104%); padding-top: 16px; }
.drawer.right { right: 0; top: 40px; width: 280px; border-radius: 24px 0 0 24px; transform: translateX(104%); }
.drawer h5 { margin: 2px 6px 4px; font-size: 12px; font-weight: 500; letter-spacing: .05em; color: var(--outline); text-transform: uppercase; }
.drawer .list { max-height: 100%; }
.drawer.right button { border: 0; background: var(--sc); text-align: left; padding: 12px 14px; border-radius: 4px; cursor: pointer; font-size: 14px; }
.drawer.right button:first-of-type { border-radius: 20px 20px 4px 4px; } .drawer.right button:last-of-type { border-radius: 4px 4px 20px 20px; }
.drawer.right button:hover { background: var(--sc-high); }
.results { display: flex; flex-direction: column; gap: 2px; }
.results button { border: 0; background: var(--sc); text-align: left; padding: 10px 14px; border-radius: 4px; cursor: pointer; display: flex; gap: 12px; align-items: center; font-size: 14px; }
.results button:first-child { border-radius: 18px 18px 4px 4px; } .results button:last-child { border-radius: 4px 4px 18px 18px; } .results button:only-child { border-radius: 18px; }
.results button span.p { color: var(--on-var); font-size: 12.5px; margin-left: auto; }
.results button:hover { background: var(--sc-high); }
.crumb { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--on-var); }
.crumb .ms { font-size: 16px; }

/* page */
.ph { display: flex; align-items: flex-start; gap: 12px; flex-wrap: wrap; }
.ph .tt { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px; }
.ph h2 { margin: 0; font-size: 30px; font-weight: 400; line-height: 1.1; }
.tabs { display: flex; gap: 2px; flex-wrap: wrap; }
.tabs button { border: 0; cursor: pointer; background: var(--sc-high); color: var(--on-var); height: 38px; padding: 0 14px; display: inline-flex; gap: 6px; align-items: center; border-radius: 4px; font-size: 13.5px; white-space: nowrap;
  transition: border-radius var(--dur) var(--cur-ease), background-color var(--dur-fx) var(--ease); }
.tabs button:first-child { border-radius: 999px 4px 4px 999px; } .tabs button:last-child { border-radius: 4px 999px 999px 4px; }
.tabs button[aria-selected="true"] { background: var(--sec); color: var(--on-sec); border-radius: 999px; }
.tabs button .ms { font-size: 17px; } .tabs button[aria-selected="false"] .ms { display: none; }
.body { flex: 1; overflow-y: auto; scrollbar-width: thin; scrollbar-color: color-mix(in srgb, var(--outline) 45%, transparent) transparent; }
.inner { width: min(100%, 760px); margin: 0 auto; display: flex; flex-direction: column; gap: 2px; }
.sec { font-size: 13px; font-weight: 500; color: var(--on-var); padding: 16px 20px 8px; }
.sec:first-child { padding-top: 0; }
.card { background: var(--sc); border-radius: 4px; padding: 12px 20px; min-height: 60px; display: flex; align-items: center; gap: 12px; }
.card.f { border-top-left-radius: 28px; border-top-right-radius: 28px; } .card.l { border-bottom-left-radius: 28px; border-bottom-right-radius: 28px; }
.card .txt .lb { font-size: 16px; } .card .txt .ds { font-size: 13px; }
.fakectl { height: 38px; min-width: 150px; border-radius: 999px; background: var(--sc-highest); display: inline-flex; align-items: center; justify-content: space-between; gap: 8px; padding: 0 12px 0 16px; font-size: 13.5px; color: var(--on-surface); flex: none; }
.sw { width: 50px; height: 30px; border-radius: 99px; background: var(--primary); position: relative; flex: none; }
.sw::after { content: "✓"; position: absolute; right: 2px; top: 2px; width: 26px; height: 26px; border-radius: 50%; background: var(--on-primary); color: var(--primary); display: grid; place-items: center; font-size: 13px; font-weight: 700; }
.sw.off { background: var(--sc-highest); } .sw.off::after { content: "✕"; right: auto; left: 2px; background: var(--outline); color: var(--sc-highest); }
.foot { display: flex; justify-content: space-between; align-items: center; }
.btn { border: 0; height: 38px; padding: 0 16px; border-radius: 999px; display: inline-flex; align-items: center; gap: 6px; font-size: 13.5px; cursor: pointer; background: transparent; color: var(--primary); }
.btn.filled { background: color-mix(in srgb, var(--on-surface) 10%, transparent); color: color-mix(in srgb, var(--on-surface) 38%, transparent); }
.btn .ms { font-size: 17px; }
.verdict { max-width: 1080px; margin: 14px auto 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; }
.verdict div { background: var(--sc-low); border-radius: 16px; padding: 12px 14px; font-size: 12.5px; color: var(--on-var); line-height: 1.5; min-width: 0; }
.verdict b { display: block; color: var(--on-surface); font-size: 13.5px; font-weight: 500; margin-bottom: 4px; }
.verdict div.on { box-shadow: inset 0 0 0 2px var(--primary); }
@media (prefers-reduced-motion: reduce) { :root { --dur: 1ms; --dur-fx: 1ms; } }
</style>

<div class="strip">
  <h1>Sub-pages: five ways to give the page more room</h1>
  <p>Open <b>Keyboard</b>, <b>Mouse &amp; Touchpad</b>, <b>Display &amp; Monitor</b> or <b>Text &amp; Fonts</b>; those have sub-pages. Today KDE adds a third column for them. Each mode below handles that differently.</p>
  <div class="row2">
    <div class="modes" role="group" aria-label="Layout mode">
      <button data-mode="drawer" aria-pressed="true"><span class="ms">left_panel_open</span>1 · Edge drawers (your idea)</button>
      <button data-mode="swap" aria-pressed="false"><span class="ms">swap_horiz</span>2 · Swap sidebar</button>
      <button data-mode="tabs" aria-pressed="false"><span class="ms">tab</span>3 · Tabs on top</button>
      <button data-mode="accordion" aria-pressed="false"><span class="ms">unfold_more</span>4 · Expand in place</button>
      <button data-mode="rail" aria-pressed="false"><span class="ms">view_sidebar</span>5 · Icon rail + flyout</button>
    </div>
    <div class="speed" role="group" aria-label="Motion speed"><span class="l">Motion</span>
      <button data-speed="fast" aria-pressed="true">Snappy 180 ms</button>
      <button data-speed="slow" aria-pressed="false">Current 500 ms bounce</button>
    </div>
  </div>
</div>
<div class="note" id="note"></div>

<div class="stage">
  <div class="win" id="win">
    <div class="deco" aria-hidden="true"><span><span class="ms">remove</span></span><span><span class="ms">crop_square</span></span><span><span class="ms">close</span></span></div>
    <div class="hole"></div>
    <nav class="nav" id="nav" aria-label="Settings"></nav>
    <main class="page" id="page"></main>
    <div class="hot left" id="hotL" title="Move here for all settings"></div>
    <div class="hot top" id="hotT" title="Move here to search"></div>
    <div class="hot right" id="hotR" title="Move here for sections on this page"></div>
    <aside class="drawer left" id="drL" aria-label="All settings"></aside>
    <aside class="drawer top" id="drT" aria-label="Search"></aside>
    <aside class="drawer right" id="drR" aria-label="On this page"></aside>
  </div>
</div>

<div class="verdict" id="verdict"></div>

  const generic = c => ({ t: c.label, secs: [["General", [[c.label, c.desc, "›"], ["Example option", "", "sw"]]]] });
  const MODES = {
    drawer: { note: "<b>Your idea, Caelestia-style.</b> Inside a category, the sidebar shows only its sub-pages. The full list lives in a <b>drawer at the left edge</b>: move the mouse there (or click the category name). <b>Top edge</b> opens search, <b>right edge</b> lists this page's sections. Only one drawer is open at a time, and each closes when the mouse leaves.", pro: "Most room for the page; feels like your desktop panels.", con: "Hidden things are harder to find; needs a visible hint line on each edge." },
    swap: { note: "<b>Swap sidebar.</b> Clicking a category with sub-pages slides the sidebar over to its sub-list, with a round <b>back</b> button. One column, always. This is what Nexus and Android Settings do.", pro: "Simple, obvious, no hidden UI.", con: "Jumping to another category takes one extra click (back)." },
    tabs: { note: "<b>Tabs on top.</b> The sidebar never changes. Sub-pages become <b>connected tab buttons</b> under the page title.", pro: "Zero extra columns, nothing hidden, the fastest to switch.", con: "Gets crowded past about 5 sub-pages (Keyboard has 4, fine)." },
    accordion: { note: "<b>Expand in place.</b> The category row opens <b>inside the sidebar</b>, showing its sub-pages as smaller rows joined to it. Only one category is open at a time.", pro: "Everything stays in one list; the page keeps full width.", con: "The list gets long; scrolling moves the other categories around." },
    rail: { note: "<b>Icon rail and flyout.</b> The sidebar shrinks to a 64 px strip of icons. <b>Hover an icon</b> to get a flyout with its name and sub-pages; click to go. This is also what a narrow window would use.", pro: "Widest page of all five modes.", con: "Icons alone are hard to learn; you rely on the hover." },
  };

  const S = { mode: "drawer", cat: "kbd", sub: "kbd-hw", open: null };
  const nav = document.getElementById("nav"), page = document.getElementById("page"), win = document.getElementById("win");
  const el = (t, c, h) => { const e = document.createElement(t); if (c) e.className = c; if (h != null) e.innerHTML = h; return e; };
  const cat = id => CATS.find(c => c.id === id);

  function corners(list, i, cur) {
    const s = i === 0 || list[i - 1].grp !== list[i].grp, e = i === list.length - 1 || list[i + 1].grp !== list[i].grp;
    return cur ? [32, 32] : [s ? 28 : 4, e ? 28 : 4];
  }
  function itemNode(c, cur, opts = {}) {
    const n = el("div", "item" + (cur ? " cur" : "") + (opts.child ? " child" : ""));
    n.tabIndex = 0; n.setAttribute("role", "button");
    n.innerHTML = (opts.child ? "" : `<span class="disc"><span class="ms">${c.icon}</span></span>`) + `<span class="txt"><span class="lb">${c.label}</span><span class="ds">${c.desc}</span></span>` + (opts.chev ? `<span class="ms chev">${opts.chev}</span>` : "");
    n.title = c.label;
    n.onkeydown = e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); n.click(); } };
    return n;
  }
  function mainList(onPick, opts = {}) {
    const box = el("div", "list");
    CATS.forEach((c, i) => {
      if (c.grp && (i === 0 || CATS[i - 1].grp !== c.grp) && !opts.noCats) box.appendChild(el("div", "cat", c.grp));
      const cur = S.cat === c.id;
      const n = itemNode(c, cur && !opts.noSel, { chev: c.kids && opts.chev ? opts.chev(c) : null });
      const [a, b] = corners(CATS, i, cur && !opts.noSel); n.style.setProperty("--tl", a + "px"); n.style.setProperty("--bl", b + "px");
      n.onclick = () => onPick(c, n); box.appendChild(n);
      if (opts.after) opts.after(c, box, i);
    });
    return box;
  }
  function subList(c, onPick) {
    const box = el("div", "list");
    c.kids.forEach(([id, label, desc], i) => {
      const cur = S.sub === id; const n = itemNode({ label, desc, icon: c.icon }, cur);
      const a = cur ? 32 : i === 0 ? 28 : 4, b = cur ? 32 : i === c.kids.length - 1 ? 28 : 4; n.style.setProperty("--tl", a + "px"); n.style.setProperty("--bl", b + "px");
      n.onclick = () => onPick(id); box.appendChild(n);
    });
    return box;
  }
  const search = () => el("label", "search", `<span class="ms">search</span><input placeholder="Search settings">`);
  function pick(c) { S.cat = c.id; S.sub = c.kids ? c.kids[0][0] : null; }

  /* ---------- sidebar per mode ---------- */
  function renderNav(dir) {
    nav.replaceChildren(); win.className = "win" + (S.mode === "rail" ? " rail" : "") + (S.mode === "drawer" ? " drawer-mode" + (cat(S.cat).kids ? " sub" : "") : "");
    const c = cat(S.cat);
    if (S.mode === "drawer") {
      if (c.kids) {
        const bar = el("div", "backbar"); const b = el("button", "chipbtn", `<span class="ms">left_panel_open</span>All settings`); b.onclick = () => openDrawer("L"); bar.append(b); bar.appendChild(el("span", "t", "")); nav.appendChild(bar);
        const h = el("div", "crumb", `<span class="ms">${c.icon}</span>${c.label}`); h.style.padding = "4px 8px"; nav.appendChild(h);
        nav.appendChild(subList(c, id => { S.sub = id; renderPage(); renderNav(); }));
      } else {
        nav.appendChild(search()); nav.appendChild(mainList(x => { pick(x); renderNav("in"); renderPage(); }, { chev: () => "chevron_right" }));
      }
    } else if (S.mode === "swap") {
      if (c.kids && S.sub) {
        const bar = el("div", "backbar"); const b = el("button", "iconbtn", `<span class="ms">arrow_back</span>`); b.setAttribute("aria-label", "Back");
        b.onclick = () => { S.sub = null; renderNav("back"); }; bar.append(b, el("span", "t", c.label)); nav.appendChild(bar);
        const l = subList(c, id => { S.sub = id; renderPage(); renderNav(); }); if (dir === "in") l.classList.add("slide"); nav.appendChild(l);
      } else {
        nav.appendChild(search());
        const l = mainList(x => { pick(x); renderNav("in"); renderPage(); }, { chev: () => "chevron_right" }); if (dir === "back") l.classList.add("slide", "back"); nav.appendChild(l);
      }
    } else if (S.mode === "tabs") {
      nav.appendChild(search()); nav.appendChild(mainList(x => { pick(x); renderNav(); renderPage(); }));
    } else if (S.mode === "accordion") {
      nav.appendChild(search());
      nav.appendChild(mainList(x => { if (S.cat === x.id && x.kids) { S.cat = "__none"; } else pick(x); renderNav(); renderPage(); }, {
        chev: x => S.cat === x.id ? "expand_less" : "expand_more", noSel: false,
        after: (x, box) => { if (x.kids && S.cat === x.id) {
          const prev = box.lastChild; prev.style.setProperty("--bl", "4px"); prev.classList.remove("cur"); prev.style.setProperty("--tl", prev.style.getPropertyValue("--tl") === "32px" ? "28px" : prev.style.getPropertyValue("--tl"));
          x.kids.forEach(([id, label, desc], k) => { const cur = S.sub === id; const n = itemNode({ label, desc }, cur, { child: true });
            n.style.setProperty("--tl", cur ? "24px" : "4px"); n.style.setProperty("--bl", cur ? "24px" : k === x.kids.length - 1 ? "28px" : "4px"); n.classList.add("slide");
            n.onclick = () => { S.sub = id; renderNav(); renderPage(); }; box.appendChild(n); }); } }
      }));
    } else if (S.mode === "rail") {
      const l = mainList(x => { pick(x); closeFly(); renderNav(); renderPage(); }, { noCats: true });
      l.querySelectorAll(".item").forEach((n, i) => { n.onmouseenter = () => showFly(CATS[i], n); n.onfocus = () => showFly(CATS[i], n); });
      nav.appendChild(el("div", "", "")).style.height = "4px"; nav.appendChild(l);
      nav.onmouseleave = e => { if (!e.relatedTarget || !e.relatedTarget.closest(".flyout")) closeFly(); };
    }
  }
  let fly = null;
  function closeFly() { fly && fly.remove(); fly = null; }
  function showFly(c, anchor) {
    closeFly(); fly = el("div", "flyout"); const r = anchor.getBoundingClientRect(), w = win.getBoundingClientRect();
    fly.style.top = Math.min(r.top - w.top - 8, w.height - 60 - (c.kids ? c.kids.length * 54 : 54)) + "px";
    fly.appendChild(el("h4", "", c.label));
    (c.kids || [[c.id, c.label, c.desc]]).forEach(([id, label, desc]) => { const b = el("button", (S.sub === id || (!c.kids && S.cat === c.id)) ? "cur" : "", `${label}<span>${desc}</span>`);
      b.onclick = () => { S.cat = c.id; S.sub = c.kids ? id : null; closeFly(); renderNav(); renderPage(); }; fly.appendChild(b); });
    fly.onmouseleave = closeFly; win.appendChild(fly);
  }

  /* ---------- page ---------- */
  function renderPage() {
    const c = cat(S.cat) || CATS[0]; const key = c.kids ? (S.sub || c.kids[0][0]) : c.id; const d = PAGE[key] || generic(c);
    page.replaceChildren();
    const ph = el("div", "ph"); const tt = el("div", "tt");
    if (S.mode === "tabs" && c.kids) {
      tt.appendChild(el("div", "crumb", `<span class="ms">${c.icon}</span>${c.label}`)); tt.appendChild(el("h2", "", d.t));
      const tabs = el("div", "tabs"); tabs.setAttribute("role", "tablist");
      c.kids.forEach(([id, label]) => { const b = el("button", "", `<span class="ms">check</span>${label}`); b.setAttribute("role", "tab"); b.setAttribute("aria-selected", S.sub === id); b.onclick = () => { S.sub = id; renderPage(); }; tabs.appendChild(b); });
      tt.appendChild(tabs);
    } else {
      if (c.kids && S.mode !== "drawer") tt.appendChild(el("div", "crumb", `<span class="ms">${c.icon}</span>${c.label}<span class="ms">chevron_right</span>${d.t}`));
      tt.appendChild(el("h2", "", d.t));
    }
    ph.appendChild(tt); page.appendChild(ph);
    const body = el("div", "body"), inner = el("div", "inner"); body.appendChild(inner);
    d.secs.forEach(([name, rows]) => { const s = el("div", "sec", name); s.dataset.sec = name; inner.appendChild(s);
      rows.forEach(([lb, ds, v], i) => { const r = el("div", "card" + (i === 0 ? " f" : "") + (i === rows.length - 1 ? " l" : ""));
        r.innerHTML = `<span class="txt"><span class="lb">${lb}</span>${ds ? `<span class="ds">${ds}</span>` : ""}</span>` + (v === "sw" ? `<span class="sw"></span>` : v === "swoff" ? `<span class="sw off"></span>` : v === "›" ? `<span class="ms chev">chevron_right</span>` : v === "✎" ? `<span class="ms" style="color:var(--on-var)">edit</span>` : `<span class="fakectl">${v}<span class="ms chev">expand_more</span></span>`);
        inner.appendChild(r); }); });
    page.appendChild(body);
    page.appendChild(el("div", "foot", `<button class="btn"><span class="ms">help</span>Help</button><button class="btn filled"><span class="ms">check</span>Apply</button>`));
    fillDrawers(d);
  }

  /* ---------- edge drawers ---------- */
  const drL = document.getElementById("drL"), drT = document.getElementById("drT"), drR = document.getElementById("drR");
  const hots = ["hotL", "hotT", "hotR"].map(id => document.getElementById(id));
  function fillDrawers(d) {
    drL.replaceChildren(el("h5", "", "All settings"), mainList(x => { pick(x); closeDrawers(); renderNav(); renderPage(); }, { chev: () => "chevron_right" }));
    drR.replaceChildren(el("h5", "", "On this page"));
    d.secs.forEach(([name]) => { const b = el("button", "", name); b.onclick = () => { page.querySelector(`[data-sec="${name}"]`)?.scrollIntoView({ behavior: "smooth", block: "start" }); }; drR.appendChild(b); });
    if (!drT.childElementCount) {
      const s = search(); const res = el("div", "results"); drT.append(s, res);
      const all = CATS.flatMap(c => c.kids ? c.kids.map(([id, l]) => ({ c, id, l, p: c.label })) : [{ c, id: null, l: c.label, p: c.grp || "" }]);
      s.querySelector("input").oninput = e => { const q = e.target.value.trim().toLowerCase(); res.replaceChildren();
        if (!q) return; all.filter(x => (x.l + " " + x.p).toLowerCase().includes(q)).slice(0, 6).forEach(x => { const b = el("button", "", `<span class="ms">${x.c.icon}</span>${x.l}<span class="p">${x.p}</span>`);
          b.onclick = () => { S.cat = x.c.id; S.sub = x.id; closeDrawers(); renderNav(); renderPage(); }; res.appendChild(b); }); };
    }
  }
  let closeT = null;
  function openDrawer(which) {
    if (S.mode !== "drawer") return; clearTimeout(closeT);
    [["L", drL], ["T", drT], ["R", drR]].forEach(([k, d]) => d.classList.toggle("open", k === which)); S.open = which;
    if (which === "T") setTimeout(() => drT.querySelector("input")?.focus(), 60);
  }
  function closeDrawers() { [drL, drT, drR].forEach(d => d.classList.remove("open")); S.open = null; }
  const softClose = () => { clearTimeout(closeT); closeT = setTimeout(() => { if (!drT.contains(document.activeElement) || !drT.querySelector("input").value) closeDrawers(); }, 220); };
  hots[0].onmouseenter = () => openDrawer("L"); hots[1].onmouseenter = () => openDrawer("T"); hots[2].onmouseenter = () => openDrawer("R");
  [drL, drT, drR].forEach(d => { d.onmouseenter = () => clearTimeout(closeT); d.onmouseleave = softClose; });
  hots.forEach(h => h.onmouseleave = e => { if (!e.relatedTarget || !e.relatedTarget.closest(".drawer")) softClose(); });
  document.addEventListener("keydown", e => { if (e.key === "Escape") { closeDrawers(); closeFly(); } });

  /* ---------- strip ---------- */
  const note = document.getElementById("note"), verdict = document.getElementById("verdict");
  function renderNote() {
    note.innerHTML = `<span class="ms">lightbulb</span><span>${MODES[S.mode].note}</span>`;
    verdict.replaceChildren(...Object.entries(MODES).map(([k, m], i) => { const d = el("div", k === S.mode ? "on" : "", `<b>${i + 1} · ${["Edge drawers", "Swap sidebar", "Tabs on top", "Expand in place", "Icon rail + flyout"][i]}</b>+ ${m.pro}<br>− ${m.con}`); return d; }));
    hots.forEach(h => h.hidden = S.mode !== "drawer");
  }
  document.querySelectorAll("[data-mode]").forEach(b => b.onclick = () => {
    document.querySelectorAll("[data-mode]").forEach(x => x.setAttribute("aria-pressed", x === b)); S.mode = b.dataset.mode; closeDrawers(); closeFly();
    if (!cat(S.cat)) S.cat = "kbd"; if (cat(S.cat).kids && !S.sub) S.sub = cat(S.cat).kids[0][0];
    renderNote(); renderNav(); renderPage();
  });
  document.querySelectorAll("[data-speed]").forEach(b => b.onclick = () => {
    document.querySelectorAll("[data-speed]").forEach(x => x.setAttribute("aria-pressed", x === b)); const slow = b.dataset.speed === "slow"; const r = document.documentElement.style;
    r.setProperty("--dur", slow ? "500ms" : "180ms"); r.setProperty("--dur-fx", slow ? "200ms" : "120ms"); r.setProperty("--cur-ease", slow ? "var(--ease-bounce)" : "var(--ease)");
  });
  renderNote(); renderNav(); renderPage();
})();
</script>
