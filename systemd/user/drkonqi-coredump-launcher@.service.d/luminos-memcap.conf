# [CHANGE: claude-code | 2026-08-29] BUG-084
# Move every DrKonqi backtrace job out of app.slice and into a slice with a hard memory
# budget, so a runaway gdb+debuginfod is OOM-killed inside its own cgroup instead of filling
# zram and stalling the whole desktop. The numbers and the reasoning are in
# systemd/user/luminos-drkonqi.slice.
#
# Slice= is set by the shipped unit (app.slice), so this must override it, not add to it.
#
# NOT DONE ON PURPOSE: `Environment=DEBUGINFOD_URLS=` was considered and rejected. It would
# reliably prevent the blowup — debuginfod downloading full Qt/KDE symbol sets is what made
# gdb grow — but it also makes every backtrace useless for reporting upstream, which is the
# only reason DrKonqi exists. The cap keeps the feature and bounds the damage.

[Service]
Slice=luminos-drkonqi.slice
