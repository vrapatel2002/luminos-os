# [CHANGE: claude-code | 2026-08-02]
# Reverses the 2026-06-03 "never sleep on lid close" policy.
# Lid close now suspends on battery AND on AC.
#
# While a Plasma session is running, PowerDevil holds a *block* inhibitor on
# handle-lid-switch, so PowerDevil's own LidAction (~/.config/powerdevilrc,
# [<profile>][SuspendAndShutdown] LidAction=1) is what actually fires.
# These settings are the fallback for SDDM, a bare TTY, or after logout.
#
# Docked is deliberately left at ignore: closing the lid while driving an
# external display should not black out the whole setup.
[Login]
HandleLidSwitch=suspend
HandleLidSwitchExternalPower=suspend
HandleLidSwitchDocked=ignore
