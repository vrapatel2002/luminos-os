#!/usr/bin/nft -f
# [CHANGE: claude-code | 2026-07-30] LAN-only firewall for luminos-server.
# [CHANGE: claude-code | 2026-09-02] Narrowed from "the whole LAN on every port"
# to named ports. DECISION 90.

# WHY THIS NO LONGER SAYS `flush ruleset`.
# It used to. `flush ruleset` deletes EVERY table, not just this one -- including
# the `ip filter`/`ip6 filter`/`ip nat`/`ip mangle` tables that tailscaled owns and
# that carry the "do not touch, managed by iptables-nft" warning. Reloading this
# file therefore silently deleted Tailscale's firewall rules, and the damage would
# only show up later as the tunnel behaving strangely. The three lines below are the
# standard idiom for "replace exactly my own table and leave everyone else's alone":
# name it (creating it if absent, so the delete cannot fail on a cold boot), delete
# it, then define it.
table inet filter
delete table inet filter

table inet filter {
  chain input {
    type filter hook input priority filter; policy drop;

    ct state invalid drop
    ct state established,related accept
    iif lo accept

    icmp type { echo-request, destination-unreachable, time-exceeded } accept
    icmpv6 type { echo-request, destination-unreachable, packet-too-big, time-exceeded, nd-neighbor-solicit, nd-neighbor-advert, nd-router-advert } accept

    # ---- the home network gets NAMED PORTS, not the whole machine ------------
    # This rule used to read `ip saddr 192.168.2.0/24 accept`, i.e. anything on the
    # home wifi could reach every port on this box. That included Sonarr, Radarr,
    # Prowlarr, NZBGet and Jellyseerr on their bare HTTP ports, and -- until today --
    # byparr, which had no authentication at all.
    #
    # The reason narrowing this costs nothing is that Caddy already publishes every
    # one of those apps over TLS on 8443-8449 (DECISION 80/84). Blocking the bare
    # ports does not remove access, it removes the UNENCRYPTED duplicate of it.
    #
    # "The LAN is trusted" was doing a lot of work as an assumption. A home network
    # holds a TV, phones, and guests, and any one of them can be the weak link.

    # SSH. Key-only (PasswordAuthentication no).
    ip saddr 192.168.2.0/24 tcp dport 22 accept comment "ssh"

    # Caddy: :80 redirects to TLS, :443 is the landing page, 8443-8449 are the
    # per-app front doors (jellyfin, jellyseerr, nzbget, space, radarr, sonarr,
    # prowlarr). One range so adding an app is a Caddyfile edit, not a firewall one.
    ip saddr 192.168.2.0/24 tcp dport { 80, 443 } accept comment "caddy front door"
    ip saddr 192.168.2.0/24 tcp dport 8443-8449 accept comment "caddy per-app tls"

    # Jellyfin's own port, in the clear, DELIBERATELY.
    # The Roku app stores a server address and does not follow redirects or accept
    # Caddy's local-CA certificate. The Caddyfile already refuses to give Jellyfin a
    # base URL for the same reason. The TV working matters more than closing this,
    # and Jellyfin requires a login regardless of where the request came from.
    ip saddr 192.168.2.0/24 tcp dport 8096 accept comment "jellyfin direct, for the roku"

    # DHCP replies. Both interfaces get their address by DHCP. A renewal that is
    # answered by broadcast is not matched by `ct state established`, so without
    # this the lease can fail to renew and the box drops off the network by itself
    # some hours later -- the exact unattended failure this whole effort is about.
    ip saddr 192.168.2.0/24 udp dport 68 accept comment "dhcp client"

    ip6 saddr fe80::/10 accept comment "ipv6 link-local, not routable off-segment"

    # [CHANGE: claude-code | 2026-08-05] Tailscale peers arrive on tailscale0
    # carrying 100.64.0.0/10 (CGNAT) addresses, which the LAN rules above do
    # NOT match -- without this, the tunnel comes up and every service is
    # silently unreachable through it. No port is opened to the internet by
    # this rule: tailscale0 only exists for authenticated mesh peers.
    #
    # This stays wide open on purpose, and it is now the DIFFERENCE that matters:
    # the tailnet is the trusted path (every peer is authenticated and every
    # machine on it is one of ours), the home subnet is not. Anything that needs a
    # port not listed above should be reached over Tailscale rather than by
    # reopening it here.
    iifname "tailscale0" accept comment "tailscale mesh"

    # [CHANGE: claude-code | 2026-08-27] qBittorrent's peer port was REMOVED here.
    # It was the only rule in this file with no source restriction -- every other
    # rule matches a source address or an interface, this one accepted from
    # anywhere, including the internet, on both tcp and udp. Torrenting has been
    # halted since DECISION 42 and closed for good by DECISION 48 (Usenet only),
    # so nothing was using it; qbittorrent-nox was uninstalled at the same time.
    # The router also has UPnP enabled, meaning a torrent client could re-open the
    # matching hole on the router by itself -- an open firewall rule plus a program
    # able to forward a port is a complete path in, so both halves were removed.

    counter comment "everything else is dropped"
  }

  chain forward {
    type filter hook forward priority filter; policy drop;
  }

  chain output {
    type filter hook output priority filter; policy accept;
  }
}
