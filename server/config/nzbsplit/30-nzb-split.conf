# [CHANGE: cowork | 2026-10-10] DECISION 140 - drop-in for 25-wireless.network.
# Packets marked 0x161 (NZBGet -> port 443, see luminos-nzb-split.nft) use table 161,
# whose only route is the Wi-Fi gateway. If Wi-Fi is down, table 161 is empty, the
# lookup falls through to the main table and those connections use Ethernet instead.
# Owned by networkd on purpose: networkd drops rules it does not own (DECISION 36a).
[Route]
Gateway=192.168.2.1
Table=161

[RoutingPolicyRule]
FirewallMark=0x161
Table=161
Priority=90
