# [CHANGE: claude-code | 2026-07-30] Camoufox downloads its Firefox build and a
# GeoIP database at runtime; the packaged unit gives byparr no writable HOME,
# so give it a state directory and point HOME/cache at it.
[Service]
StateDirectory=byparr
Environment="HOME=/var/lib/byparr"
Environment="XDG_CACHE_HOME=/var/lib/byparr/.cache"
Environment="XDG_DATA_HOME=/var/lib/byparr/.local/share"

# [CHANGE: claude-code | 2026-09-02] Loopback + sandbox. DECISION 90.
#
# The packaged unit ships HOST=0.0.0.0, so byparr listened on every interface.
# It has NO authentication of any kind -- /docs served FastAPI's interactive
# API console, HTTP 200, to anything on the LAN. Its whole job is fetching
# arbitrary URLs through a real browser, so an open one is a machine that will
# happily make requests on someone else's behalf from inside the network.
#
# Prowlarr is the only consumer and already addresses it as
# http://localhost:8191/, so loopback costs nothing. Verified no other config
# references port 8191 -- the hits in sonarr.db/radarr.db are digits inside
# UUIDs and timestamps, not settings.
Environment="HOST=127.0.0.1"

# It drives a headless Firefox over untrusted pages, which is exactly what you
# want boxed in. MemoryDenyWriteExecute is deliberately NOT set: it would break
# the JavaScript JIT and the browser would never start.
#
# ProtectSystem IS ALSO DELIBERATELY ABSENT, and that was measured, not assumed.
# With ProtectSystem=strict byparr starts cleanly and then fails every actual
# request with:
#   OSError: [Errno 30] Read-only file system:
#   '/usr/lib/python3.14/site-packages/playwright_captcha/utils/
#    camoufox_add_init_script/addon/scripts/script_*.js'
# playwright_captcha deletes and rewrites files inside its own site-packages
# directory at solve time. Every ProtectSystem level (yes/full/strict) makes
# /usr read-only, so all three break it.
#
# The obvious fix -- a ReadWritePaths carve-out for that one directory -- was
# rejected on purpose: the path contains "python3.14", and a Python minor bump
# would move it. systemd would go on starting the unit happily while byparr
# failed only at request time, which reads as "the indexers are flaky" rather
# than as a config error. A brittle carve-out that fails silently is worse than
# not having the setting at all.
NoNewPrivileges=true
PrivateTmp=true
ProtectHome=true
ProtectKernelTunables=true
ProtectKernelModules=true
ProtectControlGroups=true
RestrictSUIDSGID=true
RestrictRealtime=true
RestrictAddressFamilies=AF_INET AF_INET6 AF_UNIX AF_NETLINK
LockPersonality=true
