#!/usr/bin/nft -f
# [CHANGE: claude-code | 2026-08-31] Default-deny firewall for the G14 laptop.
# Installed at /etc/nftables.conf. See LUMINOS_DECISIONS.md DECISION 88.
#
# THIS IS NOT A COPY OF THE SERVER'S FIREWALL, AND MUST NOT BECOME ONE.
# The server sits on one network forever, so `ip saddr 192.168.2.0/24 accept`
# is a safe blanket rule there. A laptop joins airport, hotel and cafe wifi --
# the same rule would hand every stranger on those networks the same trust as
# the home LAN. So here the home subnet is named explicitly and used for as
# little as possible, and the tailnet does the heavy lifting instead: it is
# authenticated, it works from anywhere, and it does not care what wifi we are on.
#
# OUTBOUND IS DELIBERATELY UNTOUCHED (policy accept). Nothing about browsing,
# gaming, downloading, HIVE, the forex bot or any other daily use changes. This
# file only governs connections coming IN.
#
# We define our OWN table rather than `flush ruleset`. Tailscale keeps its rules
# in its own tables; flushing everything would tear those out from under a live
# tunnel. netfilter requires a packet to be accepted by EVERY input hook, so a
# drop policy here governs regardless of Tailscale's accept policy.

table inet luminos
delete table inet luminos

table inet luminos {
  chain input {
    type filter hook input priority filter; policy drop;

    ct state invalid drop
    ct state established,related accept
    iif lo accept

    # Replies to things we asked for are covered by ct above. These are the
    # control messages the network genuinely needs. Dropping ICMPv6 neighbour
    # discovery breaks IPv6 entirely, which looks like "wifi is broken".
    icmp type { echo-request, destination-unreachable, time-exceeded, parameter-problem } accept
    icmpv6 type { echo-request, destination-unreachable, packet-too-big, time-exceeded,
                  parameter-problem, nd-neighbor-solicit, nd-neighbor-advert,
                  nd-router-solicit, nd-router-advert, mld-listener-query } accept

    # DHCP replies. Without these the laptop can fail to get an address on a new
    # network, which is the most obvious possible friction.
    udp sport 67 udp dport 68 accept comment "DHCPv4 client"
    udp dport 546 accept comment "DHCPv6 client"

    # The tailnet is the trusted door, and it is the ONLY door that works from
    # outside the house. Peers are authenticated by Tailscale before a packet
    # ever reaches this chain. This is what keeps SSH and the mobile chat
    # reachable from the phone no matter which wifi the laptop is on.
    iifname "tailscale0" accept comment "tailnet peers (authenticated)"

    # Tailscale's underlay. Without this, direct peer-to-peer fails and every
    # tailnet connection falls back to a relay -- it still works, just slower,
    # which is exactly the kind of silent degradation that is hard to diagnose.
    udp dport 41641 accept comment "tailscale direct connections"

    # Service discovery: printers, casting, KDE Connect pairing. Kept because
    # losing it is visible friction and the exposure is a hostname, not data.
    udp dport { 5353, 5355 } accept comment "mDNS / LLMNR"
    tcp dport 5355 accept comment "LLMNR"

    # Home network only, and only for the two things that are actually used from
    # it. Note this matches by SUBNET, so a cafe that happens to hand out
    # 192.168.2.x would match too -- both services demand credentials anyway,
    # and SSH should move to key-only to close that properly.
    ip saddr 192.168.2.0/24 tcp dport 22 accept comment "ssh from home LAN"
    ip saddr 192.168.2.0/24 tcp dport 8090 accept comment "mobile chat from home LAN"

    # Everything else is dropped, including :9091 luminos-ram metrics, which was
    # answering HTTP 200 with 9805 bytes to any machine on the network with no
    # credentials at all. It stays running and stays reachable on loopback.
    counter comment "dropped"
  }

  chain forward {
    type filter hook forward priority filter; policy drop;
  }

  chain output {
    type filter hook output priority filter; policy accept;
  }
}
