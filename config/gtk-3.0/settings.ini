# [CHANGE: claude-code | 2026-08-05] gtk-theme-name was Adwaita-dark while gsettings
# asked for adw-gtk3-dark — and adw-gtk3-dark was not installed at all, so GTK3 fell
# back to stock Adwaita. That is why Thunar was the one ugly window: the Caelestia
# palette in gtk.css is written in libadwaita variable names (window_bg_color,
# headerbar_bg_color, view_bg_color...) which stock GTK3 Adwaita does not use, so
# almost none of it landed. adw-gtk3 is the theme that backports those names to GTK3.
# Fixed by installing `adw-gtk-theme` (official extra repo) and naming it here so this
# file and gsettings agree. Keep this file byte-identical to config/gtk-3.0/ in the repo.
[Settings]
gtk-application-prefer-dark-theme=true
gtk-button-images=true
gtk-cursor-blink=true
gtk-cursor-blink-time=1000
gtk-cursor-theme-name=Yaru
gtk-cursor-theme-size=24
gtk-decoration-layout=icon:minimize,maximize,close
gtk-enable-animations=true
gtk-font-name=Ubuntu,  10
gtk-icon-theme-name=Papirus-Dark
gtk-menu-images=true
gtk-modules=colorreload-gtk-module
gtk-primary-button-warps-slider=true
gtk-sound-theme-name=ocean
gtk-theme-name=adw-gtk3-dark
gtk-toolbar-style=3
gtk-xft-dpi=196608
