# luminos-dgpu-gate.conf
# [CHANGE: claude-code | 2026-07-03] DECISION 25 — dGPU access gate (authoritative layer)
#
# WHY THIS FILE EXISTS: `nvidia-modprobe` (setuid-root) recreates /dev/nvidia* at 0666
# root:root every time the dGPU is opened or wakes from runtime suspend, which defeats
# any udev-only permission change. These driver parameters tell the NVIDIA driver /
# nvidia-modprobe what owner/group/mode to stamp on the nodes it creates — so the gate
# survives wakes and reboots.
#
#   NVreg_DeviceFileGID  = <gid of the 'dgpu' group>  (default 0/root)
#   NVreg_DeviceFileMode = 0660  (default 0666 world-open)
#
# The 'dgpu' group gid is written live by install-dgpu-gate.sh. 948 is the value at
# install time on this machine; the installer rewrites it to match the real group.
#
# Takes effect on the next boot (module reloads from initramfs — mkinitcpio -P required).
# KILL SWITCH: sudo rm /etc/modprobe.d/luminos-dgpu-gate.conf && sudo mkinitcpio -P
options nvidia NVreg_DeviceFileUID=0 NVreg_DeviceFileGID=948 NVreg_DeviceFileMode=0660
