# [CHANGE: claude-code | 2026-08-02]
# [CHANGE: claude-code | 2026-08-25] Reversed again, on request: the G14 now
# serves Dolphin to Shawn's phone over the LAN, so it must never suspend —
# not on lid close, not after any idle period. Suspending drops the model out
# of VRAM and kills the phone chat endpoint.
#
# This is a deliberate return to the pre-BUG-091 policy. See BUG-091 for why
# the layers are separate: while a Plasma session is running, PowerDevil holds
# a *block* inhibitor on handle-lid-switch, so PowerDevil's own LidAction in
# ~/.config/powerdevilrc ([<profile>][SuspendAndShutdown] LidAction=0) is what
# actually fires. These settings are only the fallback for SDDM, a bare TTY,
# or after logout — both layers must agree or the behaviour splits by context.
[Login]
HandleLidSwitch=ignore
HandleLidSwitchExternalPower=ignore
HandleLidSwitchDocked=ignore
IdleAction=ignore
