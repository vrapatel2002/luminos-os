# [CHANGE: claude-code | 2026-08-02]
# [CHANGE: claude-code | 2026-08-25] Reversed: the G14 serves Dolphin to Shawn's
# phone over the LAN, so it must never suspend.
# [CHANGE: claude-code | 2026-09-14] Reversed AGAIN, on request, but only HALFWAY.
# Shawn asked for the never-sleep policy to be undone. He chose lid-close-only:
#
#   lid close  -> suspend   (this file + powerdevilrc LidAction=1)
#   idle       -> NEVER     (IdleAction=ignore + powerdevilrc AutoSuspendAction=0)
#
# The split is deliberate and is the whole point. Suspending still drops the model
# out of VRAM and kills the phone's 8090 endpoint, so idle suspend stays off — the
# machine keeps serving for as long as the lid is open. Closing the lid is now
# read as "I am done with it", which is an explicit act, not an absence of one.
#
# BUG-091 explains why the two layers are separate: while a Plasma session is
# running, PowerDevil holds a *block* inhibitor on handle-lid-switch, so
# ~/.config/powerdevilrc ([<profile>][SuspendAndShutdown] LidAction) is what
# actually fires. This file is only the fallback for SDDM, a bare TTY, or after
# logout. Both layers must agree or the behaviour splits by context.
#
# [CHANGE: claude-code | 2026-09-14] Docked exception REMOVED, same day it was added.
# Shawn: "i want sleep mean sleep i dont want any program app or code running got
# it if lid close every thing goes to sleep." So all three lid keys now say suspend
# — external monitor, AC, battery, it does not matter. IdleAction stays 'ignore';
# he only ever asked about the lid, and idle-never is what keeps :8090 serving.
#
# Note that these three keys are still only the fallback layer (see BUG-091 above).
# The guaranteed path is scripts/luminos-lid + 99-luminos-lid.rules, which calls
# `systemctl suspend -i` and so cannot be vetoed by an app inhibition the way
# PowerDevil can.
[Login]
HandleLidSwitch=suspend
HandleLidSwitchExternalPower=suspend
HandleLidSwitchDocked=suspend
IdleAction=ignore
