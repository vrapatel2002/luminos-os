# luminos-focus allow-list — installed as ~/.config/luminos/focus-allow.conf
# [CHANGE: claude-code | 2026-11-07]
#
# One glob per line (Go path.Match), matched against the app's systemd unit name under
# app.slice, e.g. app-org.kde.konsole-1234.scope. A matching app keeps full rights
# (CPUWeight 100, no quota) even when its windows are hidden: terminals running builds,
# torrent/download clients, games, Luminos tools. Blank lines and # lines are ignored.
# Restart luminos-focus after editing. If this file is missing the same defaults are built in.
app-*konsole*
app-*kitty*
app-*Alacritty*
app-*alacritty*
app-*foot*
app-*wezterm*
app-*ghostty*
app-*qbittorrent*
app-*transmission*
app-*steam*
app-*lutris*
app-*wine*
app-*gamescope*
app-*heroic*
app-*luminos*
# Holds the Cowork VM (qemu + virtiofsd are children of the Claude main process). Claude's
# renderers live in app-com.anthropic.Claude@*.service and ARE throttled when hidden.
app-com.anthropic.Claude-*.scope
