# ~/.config/luminos-ram-reaper.conf — luminos-ram app reaper (DECISION 160).
# [CHANGE: claude-code | 2026-10-24]
# Repo copy: ~/luminos-os/config/luminos-ram-reaper.conf. After editing:
#   systemctl --user reload luminos-ram-reaper
#
# log = dry run: write WOULD-REAP lines to ~/.local/state/luminos/ram-reaper.log, touch nothing.
# act = reap. Switch only after Shawn has read a day of the log.
reap_mode = act

# The gradient: how long an app with no window / audio / traffic / CPU may sit before it goes.
# It slides smoothly from idle_max_min (when MemAvailable >= avail_hi_gb) down to idle_min_min
# (when MemAvailable <= avail_lo_gb). No modes.
idle_max_min = 60
idle_min_min = 2
avail_hi_gb  = 6
avail_lo_gb  = 1

# What counts as "live" (any one is enough), averaged over window_s seconds.
cpu_pct           = 2     # % of one core
io_mbps           = 1     # read+write
download_kbps     = 100   # write rate that means "downloading"
net_kbps          = 1     # established TCP traffic
gpu_pct           = 1     # render-node engine busy; any open /dev/nvidia* always counts
focus_recent_min  = 5
listen_client_min = 10
window_s          = 60

# Leftovers (wine with no wineserver, Wine services with no program, browser helpers whose
# browser is gone, an app scope whose main process exited, MCP servers whose client died)
# are reaped this many seconds after they become leftovers.
leftover_grace_s = 4

# RAM-backed dirs: delete our files bigger than tmpfs_min_mb, untouched for tmpfs_age_min,
# that no process holds open or mapped.
tmpfs_dirs    = /tmp, /dev/shm
tmpfs_min_mb  = 50
tmpfs_age_min = 30

# Never reap anything whose unit, process name, program or Wine prefix contains one of these.
# (Built in already, and always kept: metatrader, terminal64.exe, metaeditor64.exe, xvfb —
#  the forex bot. Session/luminos units, the Claude Max app and the qemu Cowork VM are
#  protected in code, not here.)
keep =
