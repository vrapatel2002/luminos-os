# [CHANGE: claude-code | 2026-08-31] Encrypted DNS on the G14. DECISION 88.
#
# opportunistic, NOT yes -- and that is deliberate. The media server uses strict
# DoT because it never moves. A laptop joins hotel and airport wifi, where a
# captive portal intercepts DNS to show its login page. Strict DoT fails hard
# there and the symptom is "the internet is broken" with no way to log in.
# Opportunistic encrypts whenever the resolver supports it and degrades to plain
# only when it cannot, so a portal still works.
[Resolve]
DNS=9.9.9.9#dns.quad9.net 149.112.112.112#dns.quad9.net 2620:fe::fe#dns.quad9.net
FallbackDNS=1.1.1.1#cloudflare-dns.com
DNSOverTLS=opportunistic
Domains=~.
