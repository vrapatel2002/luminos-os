# hyprland.conf — Luminos OS, minimal Phase 3 config
# [CHANGE: claude-code | 2026-08-04]
#
# Deliberately minimal. The goal of Phase 3 is only to prove Hyprland starts, runs on the right
# GPU, and can run Claude Desktop. Caelestia Shell (Phase 4) brings the bar, launcher, notification
# daemon and theming — do NOT add those here, they would only have to be removed again.
#
# See LUMINOS_DECISIONS.md DECISION 39 for why Hyprland is allowed at all, and what it must not
# break: Plasma stays the default session, and the dGPU must still reach 0 W.

# ─────────────────────────────────────────────────────────────────────────────
# GPU — THE MOST IMPORTANT LINES IN THIS FILE. DO NOT REMOVE.
# ─────────────────────────────────────────────────────────────────────────────
# This laptop enumerates the NVIDIA dGPU FIRST:
#     card1 / renderD128 = 0x10de NVIDIA RTX 4050   (PCI 0000:01:00.0)
#     card2 / renderD129 = 0x1002 AMD iGPU          (PCI 0000:65:00.0)
#
# If Hyprland is left to choose, it can land on the NVIDIA card. That is bad twice over:
#   1. It would hold the dGPU awake forever, destroying the 0 W runtime-PM gating that the
#      BUG-047 / BUG-050 / BUG-078 work exists to achieve.
#   2. It would probably fail to start at all — /etc/environment forces Mesa-only EGL
#      (__EGL_VENDOR_LIBRARY_FILENAMES=.../50_mesa.json), so there is no NVIDIA EGL vendor
#      for it to use.
#
# So pin the compositor to the AMD iGPU explicitly.
#
# ⚠️ THE NAME USED HERE MATTERS — DO NOT "IMPROVE" IT BACK TO A by-path PATH. (BUG-094)
# aquamarine parses AQ_DRM_DEVICES as a COLON-SEPARATED LIST. The obvious stable name,
# /dev/dri/by-path/pci-0000:65:00.0-card, contains colons, so aquamarine split it into three
# garbage paths, found no GPU, and aborted the session before it ever drew a frame:
#
#     drm: Failed to canonicalize path /dev/dri/by-path/pci-0000
#     drm: Failed to canonicalize path 65
#     drm: Explicit device 00.0-card not found
#     drm: Found no gpus to use, cannot continue
#
# /dev/dri/cardN has no colons, but the number is enumeration order and is NOT stable across
# boots (the NVIDIA dGPU enumerates FIRST here, as card1). So neither stock name is both stable
# and colon-free.
#
# /dev/dri/luminos-igpu is a colon-free alias created by /etc/udev/rules.d/99-luminos-gpu-alias.rules,
# matched on the PCI address. Stable across boots, and survives the colon split.
env = AQ_DRM_DEVICES,/dev/dri/luminos-igpu

# NOTE: no NVIDIA environment variables anywhere — not here and not in /etc/environment.
# Adding them is what would undo the power gating. The dGPU stays asleep and is woken on demand
# by dgpu-exec, exactly as it is under Plasma.

# ─────────────────────────────────────────────────────────────────────────────
# Display
# ─────────────────────────────────────────────────────────────────────────────
# Left generic on purpose for the first run — let Hyprland read the panel's preferred mode rather
# than guessing. Plasma presents this panel as 1800x1125 logical, which implies a 2880x1800 panel
# at 1.6 scale; if scaling looks wrong after testing, set it explicitly here rather than fighting it.
monitor = ,preferred,auto,auto

# ─────────────────────────────────────────────────────────────────────────────
# Autostart
# ─────────────────────────────────────────────────────────────────────────────
# Polkit agent — without one, anything asking for authentication silently fails to prompt.
# Reusing KDE's, which is already installed; no need for a second one.
exec-once = /usr/lib/polkit-kde-authentication-agent-1

# Session black box. uwsm should already start this via graphical-session.target, but this is a
# cheap belt-and-braces: if Hyprland is ever launched WITHOUT uwsm, the systemd unit never fires
# and the one session we most need a record of would be the one with no record.
# The script is idempotent — a duplicate run just writes a second file.
exec-once = /home/shawn/luminos-os/scripts/luminos-session-recorder

# [CHANGE: claude-code | 2026-08-04] Open a terminal on login.
#
# This is a diagnostic, not a convenience. A bare Hyprland with no bar and no wallpaper draws a
# flat colour and nothing else — which is visually identical to a compositor that has crashed.
# On 2026-08-04 that ambiguity cost an evening: a black login screen plus a slow Plasma start got
# read as "Hyprland is crashing", when Hyprland had in fact never been launched.
#
# A terminal on screen is unambiguous proof the session is alive AND that input works, and it is
# somewhere to type if something else is wrong.
#
# KEPT ON PURPOSE even though Caelestia's bar now provides that signal: if the SHELL fails to
# start, the bar is exactly what goes missing, so relying on the bar to prove the session is
# alive is circular. kitty fails independently of Quickshell. Remove after the first successful
# real login, once the pair is known good.
exec-once = kitty

# [CHANGE: claude-code | 2026-08-04] Caelestia Shell — bar, launcher, notifications, OSDs.
#
# Started with `qs -c caelestia` rather than `caelestia shell -d`: both work (per the upstream
# README), but `qs` is the direct Quickshell invocation with no CLI wrapper in the path, so if it
# fails the error lands in the Hyprland log instead of being swallowed by a daemonising helper.
#
# NOT started via uwsm/systemd on purpose — as an exec-once it inherits HYPRLAND_INSTANCE_SIGNATURE
# automatically. Without that variable the shell still loads, but silently loses every Hyprland
# binding: the workspace widget and window list go dead. That exact failure showed up in testing.
#
# Proven 2026-08-04 in a nested session: bar, live system tray, clock, wifi/bluetooth/battery
# icons and power button all render, with zero errors in the log.
exec-once = qs -c caelestia

# ─────────────────────────────────────────────────────────────────────────────
# Input
# ─────────────────────────────────────────────────────────────────────────────
input {
    kb_layout = us
    follow_mouse = 1
    touchpad {
        natural_scroll = true
        disable_while_typing = true
    }
}

general {
    gaps_in = 4
    gaps_out = 8
    border_size = 2
    layout = dwindle
}

decoration {
    rounding = 6
}

# Animations off for the first run: fewer moving parts when diagnosing whether the session starts
# at all, and it keeps the iGPU load trivial. Caelestia can turn them back on in Phase 4.
animations {
    enabled = false
}

misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true

    # [CHANGE: claude-code | 2026-08-04] Attempt at a "not black" empty workspace.
    #
    # UNPROVEN — do not rely on this. `hyprctl getoption misc:background_color` confirms Hyprland
    # accepts the value (reads back 1712691 = 0x1A2233), but a nested test session still rendered
    # an empty workspace as pure #000000. It may only be painted by the DRM backend, which a
    # nested session cannot use. Left in because it costs nothing and may work on a real session.
    #
    # The signal actually being relied on to show the session is alive is `exec-once = kitty`
    # above, which IS proven — it mapped and rendered in the nested test.
    background_color = 0x1a2233
}

# ─────────────────────────────────────────────────────────────────────────────
# Keybinds — minimal. SUPER is the modifier.
# ─────────────────────────────────────────────────────────────────────────────
# DELIBERATELY NOT BOUND: SUPER+SPACE. That is the Luminos HIVE popup shortcut and gets wired up
# in Phase 5. Binding it here would create a conflict that is annoying to debug later.
$mod = SUPER

bind = $mod, Return, exec, kitty
bind = $mod, Q,      killactive,
bind = $mod, E,      exec, dolphin
bind = $mod, V,      togglefloating,
bind = $mod, F,      fullscreen,

# Exit via uwsm rather than Hyprland's own `exit` dispatcher, so the systemd user session
# (graphical-session.target and everything ordered against it) is torn down cleanly.
bind = $mod SHIFT, M, exec, uwsm stop

bind = $mod, left,  movefocus, l
bind = $mod, right, movefocus, r
bind = $mod, up,    movefocus, u
bind = $mod, down,  movefocus, d

bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5

bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5

bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow
