# hypr-locked.conf — apps that should open TILED instead of floating
# [CHANGE: claude-code | 2026-08-05]
#
# Everything floats by default (the catch-all rule in hypr-user.lua). Any window
# class listed here is clawed back into the dwindle tiling layout instead, so it
# snaps into place and cannot be dragged around freely.
#
# You do not normally edit this by hand. Focus the window and press:
#
#     SUPER + SHIFT + Space     lock/unlock this app  (writes to this file)
#     SUPER + ALT   + Space     float/tile just this ONE window, until it closes
#
# One window class per line. Find a class with:
#     hyprctl activewindow | grep class
#
# Only [A-Za-z0-9._-] is accepted. Anything else is SKIPPED, deliberately: these
# strings are interpolated into a Lua pattern inside the compositor config, and a
# Lua syntax error puts Hyprland into emergency mode with no keybinds registered —
# a black screen with no keyboard way out. A skipped line costs you one tiled app.
#
# Blank lines and #-comments are ignored. Changes need `hyprctl reload`, which the
# SUPER+SHIFT+Space bind does for you.
