# [CHANGE: claude-code | 2026-08-05] Synced from live; the repo mirror was still the
# pre-Hyprland Breeze/Inter set. gtk-theme-name is left as Adwaita-dark ON PURPOSE:
# adw-gtk3 ships no GTK4 variant, and libadwaita apps ignore gtk-theme-name entirely —
# gtk.css @define-color is the only lever that reaches them, and it already carries the
# Caelestia palette. Keep this file byte-identical to config/gtk-4.0/ in the repo.
[Settings]
gtk-application-prefer-dark-theme=true
gtk-cursor-blink=true
gtk-cursor-blink-time=1000
gtk-cursor-theme-name=Yaru
gtk-cursor-theme-size=24
gtk-decoration-layout=icon:minimize,maximize,close
gtk-enable-animations=true
gtk-font-name=Ubuntu,  10
gtk-icon-theme-name=Papirus-Dark
gtk-primary-button-warps-slider=true
gtk-sound-theme-name=ocean
gtk-theme-name=Adwaita-dark
gtk-xft-dpi=196608
